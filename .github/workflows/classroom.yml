name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    container:
      image: rocker/r2u:latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install curl
      run: apt update -qq && apt install -y curl
    - name: Setup environment
      run: ./setup.sh
    - name: Evaluation (development)
      id: evaluate-dev
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: evaluate-dev
        command: "./evaluate-dev.sh"
        timeout: 10
    - name: Broadcast results
      id: broadcast
      run: |
        json=$(cat ./evaluate-dev.json)
        echo "json=$json" >> $GITHUB_OUTPUT
    - name: Report results
      run: |
        PASS=${{ fromJSON(steps.broadcast.outputs.json).grade.pass }}
        TOTAL=${{ fromJSON(steps.broadcast.outputs.json).grade.total }}
        echo "::notice title=Autograding complete::Points ${PASS}/${TOTAL}"
        echo "::notice title=Autograding report::{\"totalPoints\":${PASS},\"maxPoints\":${TOTAL}}"
