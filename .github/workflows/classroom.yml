name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    container:
      image: rocker/r2u:latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install dependencies
      run: apt update -qq && apt install -y curl jq
    - name: Setup environment
      run: ./setup.sh
    - name: Evaluation (Development)
      id: evaluate-dev
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: evaluate-dev
        command: "./evaluate.sh"
        timeout: 10
    - name: Evaluation (Production)
      id: evaluate-prod
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: evaluate-prod
        command: "./production.sh"
        timeout: 10
    - name: Report results
      run: |
        json="evaluate-dev.json"
        jq . $json
        PASS=$(jq ".grade.pass[0]" $json)
        TOTAL=$(jq ".grade.total[0]" $json)
        echo "::notice title=Autograding complete::Points ${PASS}/${TOTAL}"
        echo "::notice title=Autograding report::{\"totalPoints\":${PASS},\"maxPoints\":${TOTAL}}"
